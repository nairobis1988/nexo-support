<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nexo Support</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:-apple-system,BlinkMacSystemFont,sans-serif;
      background:#050505;
      color:white;
      overflow:hidden;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .bg{
      position:absolute;
      width:700px;
      height:700px;
      background:radial-gradient(circle,#7c3aed55,#00000000);
      filter:blur(120px);
    }

    .card{
      position:relative;
      z-index:10;
      width:90%;
      max-width:720px;
      padding:50px;
      border-radius:35px;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(25px);
      text-align:center;
      box-shadow:0 0 60px rgba(124,58,237,.25);
    }

    h1{
      font-size:64px;
      margin-bottom:15px;
      letter-spacing:2px;
    }

    p{
      color:#bdbdbd;
      line-height:1.8;
      font-size:18px;
      margin-top:20px;
    }

    .mail{
      margin-top:30px;
      font-size:22px;
      color:#9f7aea;
      font-weight:600;
    }

    .button{
      display:inline-block;
      margin-top:35px;
      padding:18px 35px;
      border-radius:20px;
      background:white;
      color:black;
      text-decoration:none;
      font-weight:700;
      transition:.3s;
    }

    .button:hover{
      transform:scale(1.05);
    }

  </style>
</head>

<body>

<div class="bg"></div>

<div class="card">

  <h1>NEXO</h1>

  <p>
    Welcome to the official Nexo Support Center.
    We are here to help you with your account,
    videos, stories, reels, maps, chat,
    security and technical support.
  </p>

  <div class="mail">
    support@nexoapp.com
  </div>

  <a class="button" href="mailto:support@nexoapp.com">
    Contact Support
  </a>

</div>

</body>
</html>
